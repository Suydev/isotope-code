name: 🧪 CI — Lint & Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Node ${{ matrix.node }} on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines: node >=18.0.0  |  --env-file needs 20.6+
        node: ['20', '22']
      fail-fast: false

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # No cache — zero npm dependencies, no lockfile

      - name: ✅ Syntax check — server.mjs
        run: node --check server.mjs

      - name: ✅ Syntax check — bin/isotope CLI
        run: |
          if file bin/isotope 2>/dev/null | grep -q 'shell\|bash\|sh script'; then
            bash -n bin/isotope && echo "✅ bin/isotope syntax ok (shell)" || echo "⚠️ bin/isotope has shell syntax errors"
          elif [ -f bin/isotope ]; then
            node --check bin/isotope 2>/dev/null && echo "✅ bin/isotope ok" || echo "⚠️ bin/isotope not checkable"
          else
            echo "⚠️ bin/isotope not found — skipping"
          fi

      - name: 📋 Schema file sanity check
        run: |
          if [ -f isotope-complete.sql ]; then
            echo "=== isotope-complete.sql ==="
            echo "  Size   : $(wc -c < isotope-complete.sql) bytes"
            echo "  Lines  : $(wc -l < isotope-complete.sql)"
            echo "  Tables : $(grep -c 'CREATE TABLE' isotope-complete.sql || echo 0)"
            echo "  Funcs  : $(grep -c 'CREATE OR REPLACE FUNCTION' isotope-complete.sql || echo 0)"
            echo "  Policies: $(grep -c 'CREATE POLICY' isotope-complete.sql || echo 0)"
          else
            echo "⚠️ isotope-complete.sql not found — skipping schema stats"
          fi

      - name: 🔒 No hardcoded secrets check
        run: |
          if grep -rE 'SUPABASE_SERVICE_ROLE_KEY\s*=\s*eyJ' --include="*.mjs" --include="*.js" .; then
            echo "❌ Hardcoded service-role key detected!"
            exit 1
          fi
          echo "✅ No hardcoded secrets"

      - name: 📁 Required files present
        run: |
          for f in server.mjs package.json setup.sh isotope-complete.sql .env.example; do
            test -f "$f" && echo "✅ $f" || (echo "❌ $f missing" && exit 1)
          done
          # setup.bat is Windows-only, not required on CI
          test -f "setup.bat" && echo "✅ setup.bat" || echo "⚠️ setup.bat missing (optional)"

      - name: 🚀 Smoke test — server starts and answers /api/health
        run: |
          SUPABASE_URL=https://placeholder.supabase.co \
          SUPABASE_ANON_KEY=placeholder_anon_key \
          SESSION_SECRET=ci_smoke_test_secret_not_real \
          ADMIN_SECRET=ci_admin_placeholder \
          NODE_ENV=test \
          PORT=3099 \
          node server.mjs &
          SERVER_PID=$!
          echo "Server started (pid $SERVER_PID), polling for /api/health..."

          STATUS="000"
          for i in $(seq 1 40); do
            sleep 0.5
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3099/api/health 2>/dev/null || echo "000")
            if [ "$STATUS" != "000" ]; then
              echo "  Got HTTP $STATUS after ${i} attempts ($(echo "$i * 0.5" | bc)s)"
              break
            fi
            echo "  Attempt $i: no response yet..."
          done

          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          echo "Health check HTTP status: $STATUS"

          # Accept any real HTTP response (200, 401, 403, 5xx) — placeholder creds will cause some errors
          case "$STATUS" in
            2*|3*|4*|5*) echo "✅ Server started and responded with HTTP $STATUS" ;;
            *) echo "❌ Server did not respond (got $STATUS) — server may have crashed on startup" && exit 1 ;;
          esac
