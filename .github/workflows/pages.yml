name: Deploy GitHub Pages

on:
  push:
    branches: [main, "release/*"]
    paths:
      - docs/**
      - README.md
      - logo.svg
      - screenshots/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        # enablement: true turns Pages on via the API if it is not already, which
        # fixes "Get Pages site failed … verify that the repository has Pages
        # enabled" on repos where Pages was never switched on in Settings.
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
