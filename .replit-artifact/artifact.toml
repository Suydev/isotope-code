kind = "web"
previewPath = "/"
title = "IsotopeAI"
version = "1.0.0"
id = "artifacts/isotope"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24099

[services.development]
run = "cd /home/runner/workspace/artifacts/isotope && node server.mjs"

[services.production]
build = [ "pnpm", "--filter", "@workspace/isotope", "run", "build" ]
publicDir = "artifacts/isotope/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24099"
